services:
  - type: web
    name: after-50
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NANSEN_API_KEY
        sync: false
